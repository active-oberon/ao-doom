version: '3'

vars:
  ENGINE_DIR: '{{.ENGINE_DIR | default "../ao-game-engine"}}'

tasks:
  default:
    cmds:
      - task: build

  stage:
    cmds:
      - mkdir -p build
      - rm -f build/*.Gof* build/*.Sym*
      - cp "{{.ENGINE_DIR}}"/Game*.Mod build/
      - cp Doom*.Mod build/

  build:
    desc: Build the Linux64 windowed scene
    cmds:
      - task: stage
      - cd build && ob build --gui=640x400 DoomWindow.Mod -o ao-doom

  run:
    desc: Run the scene (optional WAD path and map after --)
    cmds:
      - task: build
      - ./build/ao-doom {{.CLI_ARGS}}

  check:
    desc: Check engine, WAD validation, movement and collision
    cmds:
      - task --dir "{{.ENGINE_DIR}}" check
      - task: stage
      - cp tests/DoomWadSmoke.Mod tests/DoomTexturesSmoke.Mod tests/DoomSectorsSmoke.Mod tests/DoomBspSmoke.Mod tests/DoomDoorsSmoke.Mod tests/DoomMaskedSmoke.Mod build/
      - cp tests/DoomSpritesSmoke.Mod build/
      - cp tests/DoomInventorySmoke.Mod tests/DoomPickupsSmoke.Mod build/
      - cp tests/DoomLockedDoorsSmoke.Mod build/
      - cp tests/DoomActorsSmoke.Mod build/
      - python3 tests/wad_fixtures.py build
      - cd build && ob build DoomWadSmoke.Mod -o wad-check
      - cd build && timeout 10 ./wad-check
      - cd build && ob build DoomTexturesSmoke.Mod -o textures-check
      - cd build && timeout 10 ./textures-check
      - cd build && ob build DoomMaskedSmoke.Mod -o masked-check
      - cd build && timeout 10 ./masked-check
      - cd build && ob build DoomSpritesSmoke.Mod -o sprites-check
      - cd build && timeout 10 ./sprites-check
      - cd build && ob build DoomInventorySmoke.Mod -o inventory-check
      - cd build && timeout 10 ./inventory-check
      - cd build && ob build DoomPickupsSmoke.Mod -o pickups-check
      - cd build && timeout 10 ./pickups-check
      - cd build && ob build DoomActorsSmoke.Mod -o actors-check
      - cd build && timeout 10 ./actors-check
      - cd build && ob build DoomSectorsSmoke.Mod -o sectors-check
      - cd build && timeout 10 ./sectors-check
      - cd build && ob build DoomBspSmoke.Mod -o bsp-check
      - cd build && timeout 10 ./bsp-check
      - cd build && ob build DoomDoorsSmoke.Mod -o doors-check
      - cd build && timeout 10 ./doors-check
      - cd build && ob build DoomLockedDoorsSmoke.Mod -o locked-doors-check
      - cd build && timeout 10 ./locked-doors-check
      - cd build && ob build Doom.Mod -o doom-check
      - cd build && timeout 10 ./doom-check
      - cp tests/DoomOriginalSmoke.Mod build/
      - cd build && ob build DoomOriginalSmoke.Mod -o original-check
      - cd build && timeout 10 ./original-check sectors.wad E1M1
      - cp tests/DoomOriginalDoorsSmoke.Mod build/
      - cd build && ob build DoomOriginalDoorsSmoke.Mod -o original-doors-check
      - cd build && timeout 10 ./original-doors-check door.wad E1M1
      - task: build

  wad-check:
    desc: Load, render and walk a local WAD map without a display
    cmds:
      - task: stage
      - cp tests/DoomOriginalSmoke.Mod build/
      - cd build && ob build DoomOriginalSmoke.Mod -o original-check
      - cd build && timeout 30 ./original-check {{.CLI_ARGS}}

  gui-check:
    desc: Check rendering, input and shutdown on X11
    cmds:
      - task: build
      - python3 tests/gui_smoke.py build/ao-doom
      - python3 tests/wad_fixtures.py build
      - python3 tests/gui_smoke.py build/ao-doom build/valid.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/sectors.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/sky.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/bsp-sectors.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/masked.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/sprites.wad E1M1
      - python3 tests/gui_smoke.py build/ao-doom build/sprites-grate.wad E1M1
      - python3 tests/gui_smoke.py --pickup build/ao-doom build/pickups.wad E1M1
      - python3 tests/gui_smoke.py --actor build/ao-doom build/actors-barrel.wad E1M1
      - python3 tests/gui_smoke.py --door build/ao-doom build/door.wad E1M1
      - python3 tests/gui_smoke.py --locked-door build/ao-doom build/door-key.wad E1M1

  door-check:
    desc: Open and cross a manual door in a local WAD map
    cmds:
      - task: stage
      - cp tests/DoomOriginalDoorsSmoke.Mod build/
      - cd build && ob build DoomOriginalDoorsSmoke.Mod -o original-doors-check
      - cd build && timeout 30 ./original-doors-check {{.CLI_ARGS}}

  bench:
    desc: Measure 200 textured frames without display transfer
    cmds:
      - task: stage
      - cp tests/SceneBench.Mod build/
      - cd build && ob build SceneBench.Mod -o scene-bench
      - cd build && timeout 30 ./scene-bench
