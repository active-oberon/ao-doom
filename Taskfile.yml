version: '3'

vars:
  ENGINE_DIR: '{{.ENGINE_DIR | default ""}}'
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  A2_PLATFORM: '{{if eq OS "windows"}}Win64{{else}}Unix64{{end}}'

tasks:
  default:
    cmds:
      - task: build

  stage:
    desc: Stage sources for the current host
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" stage'

  build:
    desc: Build for the current host (Windows or Linux)
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" build'

  build-windows:
    desc: Build Windows x64 using the native Windows SDK
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform windows --engine "{{.ENGINE_DIR}}" build'

  build-linux:
    desc: Build Linux using the native Linux SDK
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform linux --engine "{{.ENGINE_DIR}}" build'

  build-a2:
    desc: Build and package A2 modules against A2_ROOT/bin symbols
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform a2 --engine "{{.ENGINE_DIR}}" --a2-root "{{.A2_ROOT | default ""}}" --a2-platform "{{.A2_PLATFORM}}" build'

  run:
    desc: Build and run on the current host (arguments after --)
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" run {{.CLI_ARGS}}'

  run-windows:
    desc: Build and run Windows x64 (arguments after --)
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform windows --engine "{{.ENGINE_DIR}}" run {{.CLI_ARGS}}'

  run-linux:
    desc: Build and run Linux (arguments after --)
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform linux --engine "{{.ENGINE_DIR}}" run {{.CLI_ARGS}}'

  run-a2:
    desc: Run the A2 desktop adapter through the native SDK (requires A2_ROOT)
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform a2 --engine "{{.ENGINE_DIR}}" --a2-root "{{.A2_ROOT | default ""}}" --a2-platform "{{.A2_PLATFORM}}" run {{.CLI_ARGS}}'

  check:
    desc: Check engine and game on the current host, then build the GUI
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" check'

  check-windows:
    desc: Run native Windows engine and game checks
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform windows --engine "{{.ENGINE_DIR}}" check'

  check-linux:
    desc: Run native Linux engine and game checks
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform linux --engine "{{.ENGINE_DIR}}" check'

  wad-check:
    desc: Load, render and walk a local WAD without a display
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" wad-check {{.CLI_ARGS}}'

  door-check:
    desc: Open and cross a manual door in a local WAD
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" door-check {{.CLI_ARGS}}'

  bench:
    desc: Measure 200 textured frames without display transfer
    cmds:
      - '{{.PYTHON}} scripts/build.py --engine "{{.ENGINE_DIR}}" bench'

  gui-check:
    desc: Run the Linux X11 GUI regression scenarios
    cmds:
      - '{{.PYTHON}} scripts/build.py --platform linux --engine "{{.ENGINE_DIR}}" gui-check'
